<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinematic Earth</title>
    <link rel="stylesheet" href="./style.css?v=20261105" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <div id="load-status" class="load-status" role="status">正在加载地球…</div>
    <noscript>请启用浏览器的 JavaScript 以查看地球模型。</noscript>
    <div id="label" class="floating-label" hidden></div>

    <nav class="bottom-nav" aria-label="Earth interactions">
      <button type="button" class="nav-btn" data-action="auto">自动模式</button>
      <button type="button" class="nav-btn" data-action="pulse">脉冲</button>
      <button type="button" class="nav-btn" data-action="belt">银河环带</button>
      <button type="button" class="nav-btn" data-action="meteor">流星雨</button>
      <button type="button" class="nav-btn" data-action="city">城市灯火</button>
      <button type="button" class="nav-btn" data-action="scan">极光扫描</button>
      <button type="button" class="nav-btn" data-action="reset">重置视角</button>
    </nav>

    <script type="module" src="./js/boot.js"></script>
  </body>
</html>
